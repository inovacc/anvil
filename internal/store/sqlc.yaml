version: "2"
sql:
  - engine: "sqlite"
    queries: "query"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "sqlc"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "*.created_at"
            go_type: "time.Time"
          - column: "*.updated_at"
            go_type:
              type: "time.Time"
              pointer: true
