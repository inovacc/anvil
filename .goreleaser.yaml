# GoReleaser configuration
# Documentation: https://goreleaser.com

version: 2

# Hooks to run before building
before:
  hooks:
    - go generate ./...
    - go mod tidy
    - go mod verify

# Build configuration
builds:
  - id: application
    no_unique_dist_dir: true
    binary: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}amd64_v1
      {{- else if eq .Arch "arm64" }}arm64_v8.0
      {{- else if eq .Arch "arm" }}arm_{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    main: ./cmd/anvil
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

# Archive configuration
archives:
  - id: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [ tar.gz, zip ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}amd64_v1
      {{- else if eq .Arch "arm64" }}arm64_v8.0
      {{- else if eq .Arch "arm" }}arm_{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}_
      {{- .Version }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - config*.yaml

# Checksum configuration
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Snapshot configuration (for unreleased builds)
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog configuration
changelog:
  use: github
  sort: asc
  abbrev: 7
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance Improvements
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Build System
      regexp: '^.*?build(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^style:'
      - Merge pull request
      - Merge branch

# Release configuration
release:
  draft: false
  prerelease: auto
  mode: append
  header: |
    ## {{ .ProjectName }} {{ .Version }}

    **Release Date:** {{ .Date }}

    ### Installation

    ```bash
    go install github.com/inovacc/{{ .ProjectName }}@{{ .Tag }}
    ```

    Or download the binary for your platform from the assets below.

  footer: |
    ---

    **Full Changelog**: https://github.com/inovacc/{{ .ProjectName }}/compare/{{ .PreviousTag }}...{{ .Tag }}

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

# Announce configuration (optional)
announce:
  skip: "{{gt .Patch 0}}"

# Metadata
metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

